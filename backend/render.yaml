services:
  - type: web
    name: campus-exchange-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REMEMBER_ME_EXPIRE_MINUTES
        value: "43200"
